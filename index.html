
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Jogo da Memória - Arquitetura Computacional</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="app">

        <!-- Tela de início -->
        <section id="tela-inicio" class="tela">

            <h1>Jogo da Memória</h1>

            <h2>Arquitetura Computacional</h2>

            <p>
                Encontre os pares e descubra conceitos
                da arquitetura computacional!
            </p>

            <button id="botao-iniciar" class="primary">
                Começar a jogar!
            </button>

            <div class="small">
                12 pares • Aprenda brincando!
            </div>

        </section>

        <!-- Painel HUD -->
        <section id="painel-hud" class="painel-hud oculto">

            <div class="hud-item">
                ⏱ Tempo: <span id="tempo">00:00</span>
            </div>

            <div class="hud-item">
                ⭐ Acertos: <span id="acertos">0</span>
            </div>

            <div class="hud-item">
                🔄 Erros: <span id="erros">0</span>
            </div>

            <div class="spacer"></div>

            <button id="botao-dica" class="secondary">
                💡 Pedir dica
            </button>

            <button id="botao-reiniciar" class="secondary">
                Reiniciar
            </button>

        </section>

        <!-- Tabuleiro -->
        <section id="tela-tabuleiro" class="tela oculto">

            <div id="tabuleiro" class="tabuleiro" aria-label="Tabuleiro do jogo">
            </div>

        </section>

        <!-- Tela final -->
        <section id="tela-fim" class="tela oculto">

            <h2>Parabéns! Você concluiu o jogo! 🎉</h2>

            <div class="summary">

                <div>
                    ⏱ Tempo:
                    <span id="tempo-final">00:00</span>
                </div>

                <div>
                    ⭐ Acertos:
                    <span id="acertos-finais">0</span>
                </div>

                <div>
                    🔄 Erros:
                    <span id="erros-finais">0</span>
                </div>

            </div>

            <h3>Explicações</h3>

            <div id="explicacoes" class="explicacoes">
            </div>

            <div class="end-actions">

                <button id="botao-jogar-novamente" class="primary">
                    Jogar Novamente
                </button>

                <button id="botao-voltar-inicio" class="secondary">
                    Voltar ao Início
                </button>

            </div>

        </section>

    </main>

    <!-- Efeitos sonoros -->
    <audio id="som-acerto" src="./sons/acerto.wav" preload="auto"></audio>
    <audio id="som-erro" src="./sons/erro.wav" preload="auto"></audio>
    <audio id="som-conclusao" src="./sons/conclusao.wav" preload="auto"></audio>

    <script src="app.js"></script>

</body>

</html>
